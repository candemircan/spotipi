// /etc/shairport-sync.conf for spotipi. AirPlay receiver: appears as
// "spotipi" in the AirPlay picker on iPhone/iPad/Mac. Latency sync is built
// into AirPlay, so video stays lip-synced (unlike Bluetooth).
general =
{
    name = "spotipi";
};

alsa =
{
    output_device = "plughw:CARD=Device";
};
